spring.application.name=Ghumantey
# Uses Railway's port or defaults to 9090 locally
server.port=${PORT:9090}

# View Resolver Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Database Configuration (Production Friendly)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ghumantey2}
spring.datasource.username=${MYSQLUSER:root}
